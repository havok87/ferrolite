[package]
name = "ferrolite"
version = "0.1.0"
edition = "2024"
description = "A small, security-focused, LiteLLM-compatible LLM gateway"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "http1", "tokio", "service"] }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
subtle = { version = "2.6.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros", "test-util", "net"] }
