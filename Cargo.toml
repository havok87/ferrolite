[package]
name = "ferrolite"
version = "0.1.0"
edition = "2024"
description = "A small, security-focused, LiteLLM-compatible LLM gateway"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "macros", "test-util", "net"] }
